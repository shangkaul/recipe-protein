openapi: 3.1.0
info:
  title: Protein Pantry Local Intelligence API
  version: 0.2.0
servers:
  - url: http://127.0.0.1:5001/api
paths:
  /health:
    get:
      responses:
        "200":
          description: API, corpus, and local-model readiness
          content:
            application/json:
              schema:
                type: object
                required: [status, recipes, local_model]
                properties:
                  status: { const: ok }
                  recipes: { type: integer }
                  local_model: { $ref: "#/components/schemas/ModelStatus" }
  /recipes/search:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PantryRequest" }
      responses:
        "200":
          description: Ranked recipes with deterministic and locally refined pantry provenance
          content:
            application/json:
              schema:
                type: object
                required: [parsed_pantry, results, total_eligible]
                properties:
                  parsed_pantry: { $ref: "#/components/schemas/ParsedPantry" }
                  results: { type: array, items: { type: object } }
                  total_eligible: { type: integer }
        "422": { description: Invalid pantry request }
components:
  schemas:
    PantryRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 1000 }
        protein_target_g: { type: number, minimum: 5, maximum: 100, default: 30 }
        preferred_minutes: { type: [integer, "null"], minimum: 5, maximum: 240 }
        exclusions:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 80 }
        limit: { type: integer, minimum: 1, maximum: 30, default: 24 }
    ModelStatus:
      type: object
      required: [available, model, reason]
      properties:
        available: { type: boolean }
        model: { type: string }
        reason:
          enum: [not_needed, ready, service_unavailable, model_missing, timeout, invalid_output]
    ParsedPantry:
      type: object
      required: [display_terms, recognized, deterministic, refined, core, basics, unresolved, mode, model_status]
      properties:
        display_terms: { type: array, items: { type: string } }
        recognized: { type: array, items: { type: string } }
        deterministic: { type: array, items: { type: string } }
        refined: { type: array, items: { type: string } }
        core: { type: array, items: { type: string } }
        basics: { type: array, items: { type: string } }
        unresolved: { type: array, items: { type: string } }
        mode: { enum: [deterministic, locally_refined, deterministic_fallback] }
        model_status: { $ref: "#/components/schemas/ModelStatus" }
